name: Nightly Housekeeper

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Print current date and time
        run: |
          date

      - name: Run nightly cleanup
        run: |
          echo "Running nightly cleanup"

      - name: Finish cleanup
        run: |
          echo "Housekeeping complete"