name: On-Call Assistant

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install dependencies
        run: npm install
      - name: Run lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test

  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Install dependencies
        run: npm install
      - name: Build app
        run: npm run build

  analyze:
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: ${{ always() && (needs.lint.result == 'failure' || needs.test.result == 'failure' || needs.build.result == 'failure') }}
    outputs:
      is-recurring: ${{ steps.sensethelog.outputs.is-recurring }}
      signature: ${{ steps.sensethelog.outputs.signature }}
    steps:
      - name: Analyze failed jobs with SenseTheLog
        id: sensethelog
        uses: sensethelog/action@v1
        with:
          sensethelog-api-key: ${{ secrets.SENSETHELOG_API_KEY }}
      - name: Print failure pattern
        run: |
          echo "Recurring failure: ${{ steps.sensethelog.outputs.is-recurring }}"
      - name: Print error signature
        run: |
          echo "Error signature: ${{ steps.sensethelog.outputs.signature }}"

  notify-on-recurrence:
    runs-on: ubuntu-latest
    needs: analyze
    if: ${{ needs.analyze.outputs.is-recurring == 'true' }}
    steps:
      - name: Mark recurring failure as a priority
        run: |
          echo "This exact failure has happened before and should be treated as a priority fix rather than re-run and forgotten."
